<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bomberos IV">
<title>Bomberos Voluntarios Isla Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}

/* Layout: barra roja de autobomba con franja reflectiva amarilla/negra; debajo, tres vistas: PC del cuartel, celular de guardia (columna angosta) y panel de encargados.
   Tema único claro, elegido a propósito para máxima legibilidad en la PC de la entrada. */
:root{
  color-scheme:light;
  --red:#c8102e; --red-dark:#8e0a1f; --red-soft:#fbe3e6;
  --yellow:#ffc72c; --yellow-soft:#fff4d1;
  --ink:#111111; --muted:#55504b; --line:#d6d0c9;
  --bg:#f6f4f1; --surface:#ffffff; --sunk:#ece8e3;
  --green:#1d6b35; --green-soft:#dcefe1;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}

/* barra */
.bar{background:var(--red);color:#fff}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:12px}
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:62px;height:62px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.badge{width:48px;height:48px;border-radius:50%;background:var(--yellow);color:var(--ink);border:3px solid #fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.03em;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.02;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.clock{margin-left:auto;text-align:right}
.clock .t{font-family:var(--f-mono);font-size:26px;font-weight:600}
.clock .d{font-size:13px;text-transform:capitalize}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--red-dark);padding:4px;border-radius:8px}
.tabs button{border:0;background:transparent;color:#fff;padding:8px 14px;border-radius:6px;font-weight:600;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--yellow);color:var(--ink)}

.duty{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:12px;border-bottom:2px solid var(--line)}
.duty b{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.red{background:var(--red);color:#fff}
.pill.redsoft{background:var(--red-soft);color:var(--red-dark)}
.pill.yellow{background:var(--yellow);color:var(--ink)}
.pill.green{background:var(--green-soft);color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.demo{font-size:14px;color:var(--muted)}

main{padding-block:22px 56px}
h2{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;margin:0 0 4px;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
h3{font-family:var(--f-display);font-weight:700;font-size:23px;margin:0 0 10px;letter-spacing:.02em;text-transform:uppercase}
.lead{color:var(--muted);margin:0 0 18px}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.search{width:100%;max-width:440px;padding:13px 14px;border:2px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:18px}
.groups{display:grid;gap:22px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px}
.phone .names{grid-template-columns:1fr}
.name{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px;min-height:66px;border:2px solid var(--line);border-radius:8px;background:var(--surface)}
.name:hover{border-color:var(--red)}
.name .ln{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1.05}
.name .fn{font-size:15px;color:var(--muted)}
.name .in{font-size:13px;font-weight:700;color:var(--green)}

.pinbox{max-width:340px;margin:10px auto;text-align:center}
.pindots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.pindots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.pindots span.on{background:var(--red);border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:66px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--f-mono);font-size:26px;font-weight:500}
.pad button:hover{border-color:var(--ink)}
.pad button.ghost{background:transparent;border-color:transparent;font-family:var(--f-body);font-size:16px;color:var(--muted)}
.kbhint{margin:0 0 10px}
@media (hover:none){.kbhint{display:none}}
.err{color:var(--red);font-weight:700;min-height:1.4em}

.who{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.phone .grid2{grid-template-columns:1fr}
.card{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card.hot{border-color:var(--green)}
.card.alert{border-color:var(--yellow);background:var(--yellow-soft)}
.card.redb{border-color:var(--red)}
.card.off{background:var(--sunk)}
.card .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.card .top h3{margin:0}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:2px solid var(--line);border-radius:8px;background:var(--bg);min-height:62px;width:100%}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice:disabled{opacity:.55;cursor:not-allowed}
.choice .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-display);font-size:18px}
.ic.r{background:var(--red);color:#fff}.ic.y{background:var(--yellow);color:var(--ink)}.ic.k{background:var(--ink);color:#fff}.ic.g{background:var(--green);color:#fff}
.choice strong{display:block;font-size:18px}
.choice small{color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:999px;font-size:16px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.field{display:grid;gap:4px;margin-top:12px}
.field input,.field select,.field textarea{padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>.field{flex:1 1 140px}
.btn{border:2px solid transparent;border-radius:8px;padding:13px 18px;font-weight:700;font-size:17px;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--red-dark)}
.btn.go{background:var(--green);color:#fff}
.btn.outline{background:var(--surface);border-color:var(--ink)}
.btn.big{width:100%;padding:18px;font-size:20px;margin-top:14px}
.btn.small{padding:7px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.since{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1}
.deadline{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:8px;padding:10px 14px;margin:10px 0 4px;font-weight:600}
.deadline .mono{color:var(--yellow);font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-left:6px solid var(--yellow);padding:12px 18px;border-radius:8px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);z-index:10}
.list{display:grid;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.list li:first-child{border-top:0}
.list .meta{color:var(--muted);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:6px}
.stat .n{font-family:var(--f-mono);font-size:28px;font-weight:600}
.stat .k{font-size:14px;color:var(--muted)}

/* celular simulado en escritorio */
.phone{max-width:430px;margin:0 auto}
.phone-note{text-align:center;margin:-6px 0 16px}

/* panel */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.filters .field{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:2px solid var(--line);border-top:6px solid var(--red);border-radius:10px;padding:12px 16px}
.kpi.warn{border-top-color:var(--yellow)}
.kpi .n{font-family:var(--f-mono);font-size:30px;font-weight:600}
.kpi .k{font-size:14px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#fff;font-weight:700;background:var(--ink)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.warn{background:var(--yellow-soft);font-weight:600}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}
tr.sel td{background:var(--red-soft)}
.zero{color:#b7b0a9}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--ink);padding:4px;border-radius:10px;margin-bottom:14px;max-width:100%}
.seg button{border:0;background:transparent;color:#fff;padding:10px 16px;border-radius:7px;font-weight:700;font-size:16px}
.seg button[aria-selected="true"]{background:var(--red)}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) auto auto;align-items:center;gap:10px;font-size:15px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bf{display:block;height:100%;background:var(--red);border-radius:6px}
.bv{font-weight:600}.bp{color:var(--muted);font-size:13px;min-width:4.5em;text-align:right}
.pc-mots{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted)}.pc-mots b{color:var(--ink)}
.phone .barrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}.phone .bt{grid-column:1/-1;grid-row:2}.phone .bp{display:none}
@media (max-width:560px){.barrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}.bt{grid-column:1/-1;grid-row:2}.bp{display:none}}
.pcards{display:none;gap:8px}
.pcard{display:grid;gap:6px;text-align:left;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
.pcard.sel{border-color:var(--red);background:var(--red-soft)}
.pc-name{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em}
.pc-stats{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:15px}
.pc-stats b{color:var(--ink);font-size:17px}
.pc-warn{display:flex;flex-wrap:wrap;gap:6px}
.phone .pcards{display:grid}.phone .sumtable{display:none}
.phone .kpis{grid-template-columns:1fr 1fr}.phone .kpi .n{font-size:24px}
@media (max-width:700px){.pcards{display:grid}.sumtable{display:none}.kpis{grid-template-columns:1fr 1fr}}
.tot td{font-weight:700;background:var(--sunk)}
.section-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin:26px 0 10px}
.empty{color:var(--muted);padding:12px 0}
.nights{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.night{border-radius:6px;padding:6px 2px;text-align:center;font-size:13px;line-height:1.2;background:var(--sunk);color:var(--muted)}
.night b{display:block;font-family:var(--f-mono);font-size:15px;color:var(--ink)}
.night.ok{background:var(--green);color:#fff}.night.ok b{color:#fff}
.night.par{background:var(--yellow);color:var(--ink)}
.night.aus{background:var(--red);color:#fff}.night.aus b{color:#fff}
.night.cub{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.night.miss{background:var(--ink);color:var(--yellow)}.night.miss b{color:#fff}
.nlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.nlegend span{display:inline-flex;align-items:center;gap:6px}
.nlegend i.night{display:inline-block;width:14px;height:14px;padding:0;border-radius:4px}
.seg2{background:var(--sunk);margin-bottom:12px}.seg2 button{color:var(--ink)}.seg2 button[aria-selected="true"]{background:var(--ink);color:#fff}
.wktable td.wk{padding:4px 3px;text-align:center}
.wktable th.c{text-align:center;font-size:12px;line-height:1.2}
.wktable .night{display:block;min-width:58px;font-size:12px;font-weight:700;padding:6px 2px;line-height:1.1}
.wktable tr.helper td:first-child{color:var(--muted)}
.pill.dark{background:var(--ink);color:var(--yellow)}
.night.today{outline:2px solid var(--ink);outline-offset:1px}

.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--ink);vertical-align:middle}
.linkbtn{border:0;background:none;padding:4px 0 0;color:var(--red-dark);font-weight:700;text-decoration:underline;justify-self:start;font-size:14px}
.tpin{flex:1 1 160px;min-width:0;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--surface)}
.tag.red{background:var(--red);color:#fff}.tag.yellow{background:var(--yellow);color:var(--ink)}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.plist li{align-items:flex-start;flex-wrap:wrap}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pedit{display:block!important;background:var(--yellow-soft);margin:0 -18px;padding:12px 18px!important}
.newsstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:0 0 18px}
.nstrip{display:grid;gap:2px;background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--yellow);border-radius:8px;padding:10px 12px}
.nstrip b{font-size:16px;line-height:1.2}
.newsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.phone .newsgrid{grid-template-columns:1fr}
.ncard{background:var(--surface);border:2px solid var(--line);border-top:6px solid var(--red);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.ncard h3{margin:0;font-size:22px}
.newsgrid.past .ncard{border-top-color:var(--line);opacity:.75}
.ndate{font-size:14px;font-weight:600}
.nplace{margin:0;font-weight:600}
.nhasta{margin:0;font-size:14px;font-weight:700;color:var(--red-dark)}
.ntext{margin:0;color:var(--muted)}
.nfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
textarea{resize:vertical}
.notif-inline{display:flex;gap:12px;align-items:flex-start;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;border-left:6px solid var(--yellow)}
.notif-ic{width:28px;height:28px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-weight:700;flex:none}
.notif{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 32px));display:flex;gap:10px;align-items:flex-start;background:#f2f2f2;color:#111;border-radius:16px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:30;font-size:15px}
.notif img{width:36px;height:36px;flex:none}
.nt-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#555}.nt-h b{color:#111}
.saver{position:fixed;inset:0;z-index:40;background:var(--red);color:#fff;overflow:auto;cursor:none}
.sv-in{min-height:calc(100% - 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 16px;text-align:center}
.sv-logo{width:min(200px,40vw);height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.sv-title{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.6vw,32px);text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.sv-clock{font-size:clamp(56px,7vw,96px);font-weight:600;line-height:1;color:var(--yellow)}
.sv-date{font-size:20px;font-weight:600;text-transform:capitalize}
.sv-news{background:#fff;color:var(--ink);border-radius:12px;border-top:8px solid var(--yellow);padding:18px 22px;max-width:640px;width:100%;text-align:left;display:grid;gap:6px}
.sv-nt{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;text-transform:uppercase}
.sv-nd{font-weight:700;color:var(--red)}
.sv-news p{margin:0;color:var(--muted);font-size:18px}
.sv-dots{display:flex;gap:6px;margin-top:6px}.sv-dots span{width:9px;height:9px;border-radius:50%;background:var(--line)}.sv-dots span.on{background:var(--red)}
.sv-hint{font-weight:700;background:var(--ink);color:var(--yellow);padding:10px 18px;border-radius:999px;font-size:17px}

.sv-wrap{min-height:calc(100% - 12px);display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:28px;padding:28px 24px;align-items:start}
.sv-wrap.solo{grid-template-columns:1fr;justify-items:center;align-content:center}
.sv-side{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;position:sticky;top:28px}
.sv-duty{font-weight:700;background:var(--yellow);color:var(--ink);padding:6px 14px;border-radius:999px}
.sv-main{min-width:0}
.sv-h{font-family:var(--f-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;color:var(--yellow)}
.sv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sv-grid .sv-news{max-width:none}
.sv-in-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sv-person{background:var(--ink);color:#fff;border-left:6px solid #3fbf6a;border-radius:10px;padding:10px 14px;display:grid;gap:2px}
.sv-pn{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.sv-pn span{text-transform:none;font-weight:600;color:#ddd}
.sv-pm{color:var(--yellow);font-weight:600}
.sv-pt{font-size:14px;color:#ccc}
.sv-empty{margin:0;font-size:18px;font-weight:600}
.sv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sv-pl{font-weight:600}
.sv-grid.many .sv-nt{font-size:22px}.sv-grid.many .sv-news p{font-size:15px}
@media (max-width:820px){.sv-wrap{grid-template-columns:1fr}.sv-side{position:static}}

.list .x{border:0;background:none;color:var(--red-dark);font-weight:700;font-size:18px;padding:0 4px;cursor:pointer}
@media (max-width:700px){.lhead{grid-template-columns:1fr;justify-items:start}.lname{font-size:25px}.lrow{grid-template-columns:auto minmax(0,1fr)}.lpins{grid-column:2}.dl2{grid-template-columns:1fr}.dl2 dt{padding-top:6px}.medgrid{grid-template-columns:1fr;gap:8px}}

/* ---------- tareas ---------- */
.tcard{background:var(--surface);border:2px solid var(--line);border-left:8px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.tcard.urg{border-left-color:var(--red)}.tcard.cur{border-left-color:#1f6fb3}.tcard.atr{border-left-color:#f08a24}.tcard.rev{border-left-color:var(--yellow)}.tcard.ok{border-left-color:var(--green)}
.tcard .tt{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.tcard .tu{font-weight:700;color:var(--red-dark)}
.tcard .meta{font-size:14px;color:var(--muted)}
.tcard .row{margin-top:10px}
.tpills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tdevuelta{background:var(--red-soft);color:var(--red-dark);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.tnota{margin:6px 0 0;font-style:italic;color:var(--muted)}
.tfoto{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin:8px 0}
.pill.blue{background:#dbe8f6;color:#164f86}
.prog{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--green)}
.photo{display:grid!important;place-items:center;text-align:center;padding:12px;width:100%;min-height:140px;border:2px dashed var(--line);border-radius:10px;color:var(--muted);font-weight:700;background:var(--bg);margin-top:6px}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.kcol{background:var(--sunk);border-radius:12px;padding:10px;min-width:0}
.kcol h3{font-size:19px;display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}
.kcol .tcard{padding:10px 12px}.kcol .tcard .tt{font-size:18px}
.kcol.revc{background:var(--yellow-soft);box-shadow:inset 0 0 0 2px var(--yellow)}
.chip.sm{padding:6px 11px;font-size:15px}
.chip .sub{display:block;font-size:12px;font-weight:600;opacity:.85}
.chip.venc{border-color:#f08a24}
.toggle{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.toggle button{border:0;background:var(--surface);padding:8px 16px;font-weight:700}.toggle button.on{background:var(--red);color:#fff}
.summary{background:var(--ink);color:#fff;border-radius:10px;padding:14px 16px}
.summary b{color:var(--yellow)}
.side{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.pg{border-collapse:separate;border-spacing:4px;width:100%}
.pg th{background:none;color:var(--muted);font-size:12px;white-space:normal;vertical-align:bottom;padding:4px;text-align:center}
.pg th.u{text-align:left;color:var(--ink);font-size:15px;font-family:var(--f-display);text-transform:uppercase}.pg tbody th.u{vertical-align:middle}
.pg td{border:0;border-radius:8px;padding:0;text-align:center}
.pgb{width:100%;border:0;background:none;color:inherit;font-weight:700;font-size:14px;padding:10px 6px;border-radius:8px;cursor:pointer;line-height:1.2}
.pg td.ok{background:var(--green-soft);color:var(--green)}.pg td.pr{background:var(--yellow);color:var(--ink)}
.pg td.ve{background:var(--red);color:#fff}.pg td.nu{background:var(--ink);color:var(--yellow)}.pg td.as{background:#dbe8f6;color:#164f86}.pg td.na{background:transparent;color:#c2bbb3;padding:10px 6px}
.pg td small{display:block;font-weight:600;font-size:11px;opacity:.9}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin:10px 0}
.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.catgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;align-items:start}
.catls{display:grid;gap:4px}
.catl{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid transparent;background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:600;text-align:left}
.catl span{font-size:13px;color:var(--muted);font-weight:700}
.catl.on{border-color:var(--red);background:var(--red-soft)}.catl.off{opacity:.5}
.chip.ya{background:#e3eefa;border-color:#7fa9d6;color:#164f86}
.chip.dup{background:#fff4d1;border-color:#f08a24;color:var(--ink)}.chip.dup .sub{color:#8a4b00}
.chip.ya[aria-pressed="true"],.chip.dup[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.ya[aria-pressed="true"] .sub,.chip.dup[aria-pressed="true"] .sub{color:#fff}
.warnline{display:flex;gap:8px;align-items:flex-start;background:#fff4d1;border:2px solid #f08a24;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:15px}
.legmini{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:10px 0 0}
.legmini i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:2px solid}
.legmini i.ya{background:#e3eefa;border-color:#7fa9d6}.legmini i.dup{background:#fff4d1;border-color:#f08a24}.legmini i.sel{background:var(--red);border-color:var(--red)}
@media (max-width:900px){.kan,.side,.catgrid{grid-template-columns:1fr}}
</style>
